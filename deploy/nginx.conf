# nginx site for the Chess Engine API
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/chess-engine-api
#          sudo ln -s /etc/nginx/sites-available/chess-engine-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then:    sudo certbot --nginx -d engine.aws-prac-route53.com
#          (certbot adds the HTTPS server block and the HTTP -> HTTPS redirect)

# 5 requests/second per IP, bursts of 10. Applies to POSTs and WebSocket handshakes.
limit_req_zone $binary_remote_addr zone=chess_engine:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name engine.aws-prac-route53.com;

	client_max_body_size 16k;

	location / {
		limit_req zone=chess_engine burst=10 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Keep idle WebSockets open for 10 minutes
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}
}
